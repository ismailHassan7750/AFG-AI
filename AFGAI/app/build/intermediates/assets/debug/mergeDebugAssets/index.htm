function showChat(){

document.getElementById("menu").classList.remove("open");

document.getElementById("chat").innerHTML = "";

}

function openMenu(){

document.getElementById("menu").classList.toggle("open");

}
async function send() {

let box = document.getElementById("msg");
let chat = document.getElementById("chat");

let msg = box.value.trim();
let key = "";

if (msg.startsWith("/")) {
    key = "AFG_ISMAIL_OWNER_2026";
    msg = msg.substring(1).trim();
}

if(msg=="") return;

chat.innerHTML += `
<div class="message user">
<b>ته:</b><br>${msg}
</div>`;
box.value="";
let user = auth.currentUser;

if(user){

    db.collection("users")
    .doc(user.uid)
    .collection("messages")
    .add({
        text: msg,
        sender: "user",
        time: new Date()
    });

}
try{

let res = await fetch("https://afg-ai-b225.onbelmo.uk/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message: msg,
owner_key: localStorage.getItem("afg_user_id") || key,
history: JSON.parse(localStorage.getItem("chat_history") || "[]")
})
});
let data = await res.json();

let aiText = data.reply
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;");
chat.innerHTML += `
<div class="message ai">
<b>AFG AI:</b><br>
<pre style="white-space:pre-wrap;">${aiText}</pre>
</div>`;
chat.scrollTop = chat.scrollHeight;
let uid = localStorage.getItem("afg_user_id");

if(uid){

    db.collection("users")
    .doc(uid)
    .collection("messages")
    .add({
        text: aiText,
        sender: "ai",
        time: new Date()
    });

}
}catch(e){

chat.innerHTML += "<p style='color:red'><b>خطا:</b> API سره اړیکه ونشوه.</p>";

}
setTimeout(()=>{
chat.scrollTop = chat.scrollHeight;
},100);
}

function image(){

let input = document.createElement("input");

input.type = "file";
input.accept = "image/*";


input.onchange = function(){

let chat = document.getElementById("chat");

let img = document.createElement("img");

img.src = URL.createObjectURL(this.files[0]);

img.style.width = "200px";
img.style.borderRadius = "12px";
img.style.margin = "10px";


chat.appendChild(img);

chat.scrollTop = chat.scrollHeight;

};


input.click();

}




function voice(){

let SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Voice ملاتړ نه کوي");

return;

}


let rec = new SpeechRecognition();


rec.lang = "ps-AF";

rec.continuous = false;

rec.interimResults = false;


rec.onstart = function(){

console.log("Voice start");

};


rec.onresult = function(event){

document.getElementById("msg").value =
event.results[0][0].transcript;

};

rec.onerror = function(){
    alert("Voice error");
};

rec.start();

}

function newChat(){
    document.getElementById("chat").innerHTML="";
}
function showHistory(){

document.getElementById("menu").classList.remove("open");

let chat = document.getElementById("chat");

chat.innerHTML = `
<h2>🕘 Chat History</h2>
<div id="historyList">
Loading...
</div>

<br>

<button class="btn" onclick="newChat()">➕ New Chat</button>

<button class="btn" onclick="showChat()">⬅️ Back to Chat</button>
`;

let uid = localStorage.getItem("afg_user_id");

if(!uid){
    document.getElementById("historyList").innerHTML =
    "Login وکړئ چې History وګورئ";
    return;
}

db.collection("users")
.doc(uid)
.collection("messages")
.orderBy("time")
.get()
.then(snapshot => {

let html = "";

snapshot.forEach(doc => {

let m = doc.data();

html += `
<div class="setting-item">
<b>${m.sender=="user" ? "👤 ته" : "🤖 AFG AI"}:</b>
<br>
${m.text}
</div>
`;

});

document.getElementById("historyList").innerHTML =
html || "History نشته";

});

}
